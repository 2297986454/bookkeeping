<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易记账本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FF6B9D 0%,#E63976 50%,#1A1A1A 100%);color:#fff}
.container{text-align:center;max-width:420px;padding:30px 20px}
h1{font-size:28px;margin-bottom:8px;font-weight:700}
.subtitle{font-size:14px;opacity:.8;margin-bottom:30px}
.card{background:rgba(255,255,255,.95);border-radius:16px;padding:24px 20px;margin-bottom:14px;text-decoration:none;color:#333;transition:transform .2s,box-shadow .2s;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.card-title{font-size:18px;font-weight:700;margin-bottom:6px}
.card-desc{font-size:13px;color:#888}
.card-tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;margin-top:8px;font-weight:600}
.tag-pink{background:#FFE5EC;color:#E63976}
.tag-white{background:#F0F0F0;color:#1A1A1A}
.tag-dual{background:linear-gradient(135deg,#FFE5EC,#F0F0F0);color:#333}
.footer{font-size:12px;opacity:.6;margin-top:20px}
</style>
</head>
<body>
<div class="container">
<h1>简易记账本</h1>
<div class="subtitle">选择你喜欢的风格开始记账</div>
<a href="记账插件-双主题版.html" class="card">
<div class="card-title">双主题版（推荐）</div>
<div class="card-desc">粉色波点 + 白灰波点，随时切换</div>
<span class="card-tag tag-dual">推荐使用</span>
</a>
<a href="记账插件.html" class="card">
<div class="card-title">粉色波点版</div>
<div class="card-desc">可爱粉色主题，波点纹理</div>
<span class="card-tag tag-pink">粉色</span>
</a>
<a href="记账插件-白色简约版.html" class="card">
<div class="card-title">白色简约版</div>
<div class="card-desc">极简白色主题，衬线字体</div>
<span class="card-tag tag-white">白色</span>
</a>
<div class="footer">数据保存在你的浏览器中，无需登录</div>
</div>
</body>
</html>
