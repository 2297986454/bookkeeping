<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易记账本</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
--bg:#F7F7F5;
--card:#FFFFFF;
--ink:#1A1A1A;
--ink-2:#555555;
--ink-3:#8A8A8A;
--ink-4:#C4C4C4;
--line:#EAEAEA;
--line-2:#F0F0F0;
--accent:#1A1A1A;
--expense:#D64545;
--expense-bg:#FBF0F0;
--income:#2D9B6F;
--income-bg:#F0F8F4;
--shadow:0 1px 3px rgba(0,0,0,.04);
--shadow-lg:0 4px 20px rgba(0,0,0,.06);
--radius:10px;
--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);font-weight:400}
.header{background:var(--card);color:var(--ink);padding:28px 20px 22px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
.header h1{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;text-align:center;letter-spacing:2px}
.summary{text-align:center;margin-top:16px}
.balance{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;letter-spacing:-1px;color:var(--ink)}
.balance-label{font-size:10px;color:var(--ink-3);margin-top:3px;text-transform:uppercase;letter-spacing:2px}
.summary-row{display:flex;justify-content:center;gap:36px;margin-top:12px;font-size:12px;color:var(--ink-3)}
.summary-row span{font-weight:500}
.income-text{color:var(--income)}
.expense-text{color:var(--expense)}
.card{background:var(--card);border-radius:var(--radius);margin:12px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.section-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:700;margin-bottom:16px;color:var(--ink);padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.type-tabs{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.type-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;background:var(--card);color:var(--ink-3);transition:all .2s;border:none}
.type-tab.active.expense{color:var(--expense);background:var(--expense-bg);font-weight:700}
.type-tab.active.income{color:var(--income);background:var(--income-bg);font-weight:700}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:6px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:all .2s;background:var(--bg);color:var(--ink);font-family:inherit}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--ink-3);background:var(--card)}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-item{text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;font-size:11px;font-weight:500;transition:all .2s;background:var(--card);color:var(--ink-2)}
.cat-item:hover{border-color:var(--ink-3);color:var(--ink)}
.cat-item.selected{border-color:var(--ink);color:var(--ink);background:var(--bg);font-weight:700}
.cat-icon{font-size:20px;display:block;margin-bottom:3px}
.btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:all .15s;letter-spacing:1px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#333}
.filter-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-3);transition:all .2s}
.filter-btn:hover{border-color:var(--ink-3)}
.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.record-list{max-height:420px;overflow-y:auto}
.record-list::-webkit-scrollbar{width:3px}
.record-list::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:10px}
.record-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-2)}
.record-item:last-child{border-bottom:none}
.record-left{display:flex;align-items:center;gap:10px}
.record-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--bg);border:1px solid var(--line)}
.record-info .record-cat{font-size:14px;font-weight:500;color:var(--ink)}
.record-info .record-note{font-size:12px;color:var(--ink-3)}
.record-info .record-date{font-size:11px;color:var(--ink-4)}
.record-amount{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace}
.empty{text-align:center;padding:40px;color:var(--ink-4);font-size:13px}
.edit-btn{background:none;border:none;color:var(--ink-4);cursor:pointer;font-size:14px;padding:4px 6px;transition:all .2s;border-radius:6px}
.edit-btn:hover{color:var(--ink);background:var(--bg)}
.del-btn{background:none;border:none;color:var(--ink-4);cursor:pointer;font-size:14px;padding:4px 6px;transition:all .2s;border-radius:6px}
.del-btn:hover{color:var(--expense);background:var(--expense-bg)}
.record-actions{display:flex;align-items:center;gap:2px}
.cancel-edit-btn{background:var(--bg);border:1px solid var(--line);color:var(--ink-2);padding:12px 0;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:8px;display:none;transition:all .2s}
.cancel-edit-btn:hover{background:var(--line-2)}
.edit-hint{background:var(--expense-bg);border:1px solid #E8D0D0;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--expense);font-weight:500;display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);display:flex;border-top:1px solid var(--line);z-index:100}
.nav-item{flex:1;text-align:center;padding:12px 0;cursor:pointer;color:var(--ink-4);font-size:11px;font-weight:500;transition:color .2s}
.nav-item.active{color:var(--ink)}
.nav-icon{font-size:20px;display:block;margin-bottom:2px}
.page{display:none;padding-bottom:72px}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.month-selector{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-nav-btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);width:32px;height:32px;font-size:15px;cursor:pointer;flex-shrink:0;transition:all .2s}
.month-nav-btn:hover{background:var(--bg)}
.month-nav-btn:active{transform:scale(.92)}
.month-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:700;flex:1;text-align:center;color:var(--ink)}
.month-summary{display:flex;gap:8px;margin-bottom:14px}
.month-summary-item{flex:1;text-align:center;padding:12px 6px;border-radius:var(--radius-sm);font-size:10px;font-weight:500;border:1px solid var(--line)}
.month-summary-item .ms-val{font-size:15px;font-weight:700;margin-top:4px;font-family:'JetBrains Mono',monospace}
.ms-expense{background:var(--expense-bg);border-color:#E8D0D0;color:var(--expense)}
.ms-income{background:var(--income-bg);border-color:#C0E0D0;color:var(--income)}
.ms-balance{background:var(--bg);color:var(--ink)}
.year-selector{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.year-nav-btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);width:32px;height:32px;font-size:15px;cursor:pointer;flex-shrink:0;transition:all .2s}
.year-nav-btn:hover{background:var(--bg)}
.year-nav-btn:active{transform:scale(.92)}
.year-title{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;flex:1;text-align:center;color:var(--ink)}
.month-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.month-card{background:var(--bg);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.month-card:hover{border-color:var(--ink-4)}
.month-card.current{border-color:var(--ink);background:var(--card)}
.month-card .mc-month{font-size:12px;color:var(--ink-3);margin-bottom:4px;font-weight:500}
.month-card .mc-expense{font-size:17px;font-weight:700;color:var(--expense);font-family:'JetBrains Mono',monospace}
.month-card .mc-income{font-size:11px;color:var(--income);margin-top:2px;font-weight:500}
.month-card .mc-empty{color:var(--ink-4);font-size:12px}
.year-total-card{background:var(--ink);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:18px}
.year-total-card .yt-label{font-size:11px;opacity:.7;font-weight:500;text-transform:uppercase;letter-spacing:1px}
.year-total-card .yt-val{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin:4px 0}
.year-total-row{display:flex;gap:16px;font-size:12px;margin-top:8px}
.year-total-row span{font-weight:500}
.year-stats-title{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:700;margin:20px 0 12px;color:var(--ink)}
.ocr-area{border:1.5px dashed var(--ink-4);border-radius:var(--radius-sm);padding:20px;text-align:center;margin-bottom:16px;cursor:pointer;transition:all .2s;position:relative;background:var(--bg)}
.ocr-area:hover{border-color:var(--ink-3);background:var(--card)}
.ocr-area.has-img{padding:0;overflow:hidden;border-style:solid;border-color:var(--line)}
.ocr-preview{max-width:100%;max-height:200px;border-radius:var(--radius-sm);display:block;margin:0 auto}
.ocr-icon{font-size:32px;display:block;margin-bottom:6px}
.ocr-hint{font-size:12px;color:var(--ink-3);font-weight:500}
.ocr-loading{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius-sm)}
.ocr-spinner{width:34px;height:34px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-loading-text{font-size:12px;color:var(--ink-2);font-weight:500}
.ocr-result{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;font-size:13px}
.ocr-result .or-row{display:flex;justify-content:space-between;margin-bottom:4px}
.ocr-result .or-label{color:var(--ink-3);font-weight:500}
.ocr-result .or-val{font-weight:700;color:var(--ink);font-family:'JetBrains Mono',monospace}
.ocr-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px}
.ocr-badge.expense{background:var(--expense-bg);color:var(--expense)}
.ocr-badge.income{background:var(--income-bg);color:var(--income)}
.toast{position:fixed;top:58%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:11px 26px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ocr-cancel{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:13px;cursor:pointer;z-index:5;line-height:26px;text-align:center;transition:background .2s}
.ocr-cancel:hover{background:var(--ink)}
.backup-section{text-align:center;padding:4px 0}
.backup-btns{display:flex;gap:8px;margin-bottom:10px}
.backup-btn{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:all .15s}
.backup-btn:active{transform:scale(.98)}
.backup-export{background:var(--ink);color:#fff}
.backup-export:hover{background:#333}
.backup-import{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.backup-import:hover{background:var(--bg)}
.data-warning{font-size:11px;color:var(--ink-3);line-height:1.7;text-align:center;padding:10px 12px;margin-top:6px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--line)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:9998;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:var(--radius);padding:28px 22px;width:85%;max-width:360px;text-align:center;box-shadow:var(--shadow-lg);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:10px}
.modal-text{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:20px}
.modal-text b{color:var(--ink)}
.modal-btns{display:flex;gap:8px}
.modal-btn{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:all .15s}
.modal-btn:active{transform:scale(.98)}
.modal-confirm{background:var(--ink);color:#fff}
.modal-cancel{background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
</style>
</head>
<body>

<div class="header">
<h1>简易记账本</h1>
<div class="summary">
<div class="balance" id="totalBalance">¥0.00</div>
<div class="balance-label">本月结余</div>
<div class="summary-row">
<span class="income-text" id="totalIncome">收入 ¥0.00</span>
<span class="expense-text" id="totalExpense">支出 ¥0.00</span>
</div>
</div>
</div>

<!-- 记账页面 -->
<div class="page active" id="pageAdd">
<div class="card">
<div class="section-title" id="addSectionTitle">添加账目</div>
<div class="edit-hint" id="editHint">正在编辑记录，修改后点击「保存修改」</div>
<input type="file" id="billImageInput" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
<div class="ocr-area" id="ocrArea" onclick="document.getElementById('billImageInput').click()">
<div id="ocrPlaceholder">
<span class="ocr-icon">📷</span>
<span class="ocr-hint">点击上传账单截图，自动识别金额、日期、收支类型</span>
</div>
<div id="ocrLoading" class="ocr-loading" style="display:none">
<div class="ocr-spinner"></div>
<div class="ocr-loading-text">正在识别账单内容...</div>
</div>
</div>
<div id="ocrResult" style="display:none"></div>
<div class="type-tabs">
<div class="type-tab expense active" data-type="expense">支出</div>
<div class="type-tab income" data-type="income">收入</div>
</div>
<div class="input-group">
<label>金额</label>
<input type="number" id="amount" placeholder="请输入金额" step="0.01">
</div>
<div class="input-group">
<label>分类</label>
<div class="category-grid" id="categoryGrid"></div>
</div>
<div class="input-group">
<label>日期</label>
<input type="date" id="date">
</div>
<div class="input-group">
<label>备注</label>
<input type="text" id="note" placeholder="选填">
</div>
<button class="btn btn-primary" id="submitBtn" onclick="addRecord()">记一笔</button>
<button class="cancel-edit-btn" id="cancelEditBtn" onclick="cancelEdit()">取消编辑</button>
</div>
</div>

<!-- 明细页面 -->
<div class="page" id="pageList">
<div class="card">
<div class="section-title">账单明细</div>
<div class="month-selector">
<button class="month-nav-btn" onclick="changeViewMonth(-1)">‹</button>
<div class="month-title" id="viewMonthTitle">2026年8月</div>
<button class="month-nav-btn" onclick="changeViewMonth(1)">›</button>
</div>
<div class="month-summary">
<div class="month-summary-item ms-expense"><div>支出</div><div class="ms-val" id="viewMonthExpense">¥0.00</div></div>
<div class="month-summary-item ms-income"><div>收入</div><div class="ms-val" id="viewMonthIncome">¥0.00</div></div>
<div class="month-summary-item ms-balance"><div>结余</div><div class="ms-val" id="viewMonthBalance">¥0.00</div></div>
</div>
<div class="filter-bar" id="filterBar">
<div class="filter-btn active" data-filter="all">全部</div>
<div class="filter-btn" data-filter="expense">仅支出</div>
<div class="filter-btn" data-filter="income">仅收入</div>
</div>
<div class="record-list" id="recordList"></div>
</div>
</div>

<!-- 统计页面 -->
<div class="page" id="pageStats">
<div class="card">
<div class="year-selector">
<button class="year-nav-btn" onclick="changeViewYear(-1)">‹</button>
<div class="year-title" id="viewYearTitle">2026年</div>
<button class="year-nav-btn" onclick="changeViewYear(1)">›</button>
</div>
<div class="year-total-card">
<div class="yt-label">年度总支出</div>
<div class="yt-val" id="yearTotalExpense">¥0.00</div>
<div class="year-total-row">
<span style="color:#7BCDA0">收入 ¥<span id="yearTotalIncome">0.00</span></span>
<span style="color:#E8A0A0">月均支出 ¥<span id="yearAvgExpense">0.00</span></span>
</div>
</div>
<div class="year-stats-title">月度支出明细</div>
<div class="month-grid" id="yearMonthGrid"></div>
</div>
<div class="card">
<div class="section-title">本月分类概览</div>
<div id="statsContent"></div>
</div>
<div class="card">
<div class="section-title">数据备份与恢复</div>
<div class="backup-section">
<div class="backup-btns">
<button class="backup-btn backup-export" onclick="exportData()">导出备份</button>
<button class="backup-btn backup-import" onclick="document.getElementById('importFileInput').click()">导入恢复</button>
</div>
<input type="file" id="importFileInput" accept=".json" style="display:none" onchange="handleImportFile(this)">
<div class="data-warning">⚠️ 无痕模式打开不会保存记账记录，清理浏览器缓存会丢失数据，请定期备份</div>
</div>
</div>
</div>
<div class="modal-overlay" id="confirmModal">
<div class="modal-box">
<div class="modal-title" id="modalTitle">确认导入</div>
<div class="modal-text" id="modalText"></div>
<div class="modal-btns">
<button class="modal-btn modal-cancel" onclick="closeModal()">取消</button>
<button class="modal-btn modal-confirm" id="modalConfirmBtn">确认</button>
</div>
</div>
</div>

<div class="nav">
<div class="nav-item active" onclick="switchPage('pageAdd',this)">
<span class="nav-icon">✏️</span>记账
</div>
<div class="nav-item" onclick="switchPage('pageList',this)">
<span class="nav-icon">📋</span>明细
</div>
<div class="nav-item" onclick="switchPage('pageStats',this)">
<span class="nav-icon">📊</span>统计
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
var STORAGE_KEY = 'bookkeeping_records';
var currentType = 'expense';
var currentCategory = '';
var currentFilter = 'all';
var viewMonth = new Date().getMonth();
var viewYear = new Date().getFullYear();
var editingId = null;

var categories = {
expense: [
{key:'food',icon:'🍔',name:'餐饮'},
{key:'transport',icon:'🚌',name:'交通'},
{key:'shopping',icon:'🛒',name:'购物'},
{key:'daily',icon:'🏠',name:'日用'},
{key:'fun',icon:'🎮',name:'娱乐'},
{key:'medical',icon:'💊',name:'医疗'},
{key:'edu',icon:'📚',name:'教育'},
{key:'other_e',icon:'📝',name:'其他'}
],
income: [
{key:'salary',icon:'💰',name:'工资'},
{key:'bonus',icon:'🎁',name:'奖金'},
{key:'invest',icon:'📈',name:'理财'},
{key:'redpacket',icon:'🧧',name:'红包'},
{key:'parttime',icon:'🛠️',name:'兼职'},
{key:'refund',icon:'💳',name:'退款'},
{key:'other_i',icon:'📝',name:'其他'}
]
};

var catNameMap = {};
categories.expense.forEach(function(c){catNameMap[c.key]=[c.icon,c.name];});
categories.income.forEach(function(c){catNameMap[c.key]=[c.icon,c.name];});

function getRecords(){
try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}
catch(e){return[];}
}
function saveRecords(r){localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}

function renderCategories(){
var list = categories[currentType];
var html = list.map(function(c){

function preprocessImage(imgDataUrl,callback){
var img=new Image();
img.onload=function(){
var canvas=document.createElement('canvas');
var maxW=1600;
var scale=img.width>maxW?maxW/img.width:1;
canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);
var ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,canvas.width,canvas.height);
try{
var imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
var data=imageData.data;
var totalBrightness=0;
var pixelCount=data.length/4;
for(var i=0;i<data.length;i+=4){
totalBrightness+=data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114;
}
var avgBrightness=totalBrightness/pixelCount;
if(avgBrightness<128){
for(var i=0;i<data.length;i+=4){
data[i]=255-data[i];
data[i+1]=255-data[i+1];
data[i+2]=255-data[i+2];
}
ctx.putImageData(imageData,0,0);
var enhanced=ctx.getImageData(0,0,canvas.width,canvas.height);
var edata=enhanced.data;
var contrast=1.8;
var factor=259*(contrast+255)/(255*(259-contrast));
for(var i=0;i<edata.length;i+=4){
edata[i]=Math.max(0,Math.min(255,factor*(edata[i]-128)+128));
edata[i+1]=Math.max(0,Math.min(255,factor*(edata[i+1]-128)+128));
edata[i+2]=Math.max(0,Math.min(255,factor*(edata[i+2]-128)+128));
}
ctx.putImageData(enhanced,0,0);
callback(canvas.toDataURL('image/png'));
}else{
callback(imgDataUrl);
}
}catch(e){
callback(imgDataUrl);
}
};
img.onerror=function(){callback(imgDataUrl);};
img.src=imgDataUrl;
}

function runOcr(imgDataUrl){
preprocessImage(imgDataUrl,function(processedImg){
Tesseract.recognize(processedImg,'chi_sim+eng',{
logger:function(m){
var lt=document.querySelector('.ocr-loading-text');
if(lt&&m.status){
var map={'recognizing text':'正在识别文字...','loading tesseract core':'加载引擎中...','initializing tesseract':'初始化中...','loading language traineddata':'加载语言数据...','initializing api':'准备识别...'};
lt.textContent=map[m.status]||m.status;
}
}
}).then(function(result){
parseBillResult(result);
}).catch(function(){
Tesseract.recognize(imgDataUrl,'chi_sim+eng',{logger:function(){}}).then(function(result){
parseBillResult(result);
}).catch(function(){
document.getElementById('ocrArea').innerHTML='<div id="ocrPlaceholder"><span class="ocr-icon">📷</span><span class="ocr-hint">识别失败，请重新上传或手动填写</span></div>';
document.getElementById('ocrArea').classList.remove('has-img');
document.getElementById('ocrArea').onclick=function(){document.getElementById('billImageInput').click();};
});
});
});
}

function extractAmountFromText(s){
var candidates=s.match(/[-−–]?\s*\d[\d,]*[.]?\d*/g)||[];
var best=null,bestScore=-1;
candidates.forEach(function(c){
var cleaned=c.replace(/[-−–\s,]/g,'');
if(!cleaned)return;
var hasDot=c.indexOf('.')>=0||c.indexOf('．')>=0;
var parts=cleaned.split('.');
var intPart=parts[0];
var decPart=parts.length>1?parts[1]:'';
if(!hasDot&&intPart.length>8)return;
if(hasDot&&intPart.length>7)return;
var n=parseFloat(cleaned);
if(isNaN(n)||n<=0||n>9999999)return;
var score=0;
if(hasDot&&decPart.length===2)score+=10;
else if(hasDot&&decPart.length>0)score+=5;
else if(intPart.length<=6)score+=3;
else score+=1;
if(score>bestScore){bestScore=score;best=cleaned;}
});
return best;
}

function parseBillResult(result){
var text=(result&&result.data&&result.data.text)||'';
var lines=(result&&result.data&&result.data.lines)||[];
var words=(result&&result.data&&result.data.words)||[];
var resultObj={amount:'',date:'',type:''};

var maxLine=null,maxLineHeight=0;
lines.forEach(function(line){
if(line.bbox&&line.text){
var h=line.bbox.y1-line.bbox.y0;
if(h>maxLineHeight&&/[\d]/.test(line.text)){maxLineHeight=h;maxLine=line;}
}
});
if(maxLine&&maxLine.text){
var amt=extractAmountFromText(maxLine.text);
if(amt)resultObj.amount=amt;
}

if(!resultObj.amount){
var numWords=words.filter(function(w){return w.bbox&&/[\d]/.test(w.text);});
numWords.sort(function(a,b){return(b.bbox.y1-b.bbox.y0)-(a.bbox.y1-a.bbox.y0);});
if(numWords.length>0){
var topH=numWords[0].bbox.y1-numWords[0].bbox.y0;
var bigWords=numWords.filter(function(w){return(w.bbox.y1-w.bbox.y0)>topH*0.7;});
var combined='';
bigWords.forEach(function(w){combined+=w.text;});
var cm=extractAmountFromText(combined);
if(cm)resultObj.amount=cm;
else{
var singleM=extractAmountFromText(numWords[0].text);
if(singleM)resultObj.amount=singleM;
}
}
}

if(!resultObj.amount){
var fallback=extractAmountFromText(text);
if(fallback)resultObj.amount=fallback;
}

var timeKwMatch=text.match(/(?:支付时间|交易时间|时间|日期|创建时间)\s*[:：]?\s*(\d{4})\s*[-年\/]\s*(\d{1,2})\s*[-月\/]\s*(\d{1,2})/);
if(timeKwMatch){
resultObj.date=timeKwMatch[1]+'-'+pad(parseInt(timeKwMatch[2]))+'-'+pad(parseInt(timeKwMatch[3]));
}else{
var dateMatch=text.match(/(\d{4})\s*[-年\/]\s*(\d{1,2})\s*[-月\/]\s*(\d{1,2})\s*日?/);
if(dateMatch){
resultObj.date=dateMatch[1]+'-'+pad(parseInt(dateMatch[2]))+'-'+pad(parseInt(dateMatch[3]));
}else{
var mdMatch=text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
if(mdMatch){
var now=new Date();
resultObj.date=now.getFullYear()+'-'+pad(parseInt(mdMatch[1]))+'-'+pad(parseInt(mdMatch[2]));
}
}
}

var incomeKeywords=['收入','收款','转入','退款','到账','红包','工资','报销','奖金','利息','分红','理财收益','退还','已收','收款成功'];
var expenseKeywords=['支出','付款','消费','实付','转账','代付','餐饮','购物','缴费','充值','外卖','打车','机票','酒店','支付成功','支付完成','一卡通充值','已付'];
var incomeScore=0,expenseScore=0;
incomeKeywords.forEach(function(kw){if(text.indexOf(kw)>=0)incomeScore++;});
expenseKeywords.forEach(function(kw){if(text.indexOf(kw)>=0)expenseScore++;});
var hasNegSign=text.match(/[-−–]\s*\d/)||(maxLine&&/[-−–]/.test(maxLine.text));
if(hasNegSign)expenseScore+=2;
if(text.indexOf('支付成功')>=0||text.indexOf('支付完成')>=0)expenseScore+=1;
if(incomeScore>expenseScore){resultObj.type='income';}
else if(expenseScore>0){resultObj.type='expense';}
else{resultObj.type='expense';}

applyOcrResult(resultObj);
}

function applyOcrResult(result){
var area=document.getElementById('ocrArea');
var loading=area.querySelector('.ocr-loading');
if(loading)loading.style.display='none';

var typeText=result.type==='income'?'收入':'支出';
var typeClass=result.type==='income'?'income':'expense';
var html='<div class="ocr-result"><div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--ink-2)">识别结果（已自动填入）</div>';
html+='<div class="or-row"><span class="or-label">类型</span><span class="or-val"><span class="ocr-badge '+typeClass+'">'+typeText+'</span></span></div>';
if(result.amount){
html+='<div class="or-row"><span class="or-label">金额</span><span class="or-val">¥'+result.amount+'</span></div>';
}else{
html+='<div class="or-row"><span class="or-label">金额</span><span class="or-val" style="color:var(--expense)">未识别，请手动填写</span></div>';
}
if(result.date){
html+='<div class="or-row"><span class="or-label">日期</span><span class="or-val">'+result.date+'</span></div>';
}else{
html+='<div class="or-row"><span class="or-label">日期</span><span class="or-val" style="color:var(--expense)">未识别，默认今天</span></div>';
}
html+='<div style="font-size:11px;color:var(--ink-4);margin-top:6px">请核对后修改分类并提交</div></div>';
document.getElementById('ocrResult').innerHTML=html;
document.getElementById('ocrResult').style.display='block';

if(result.type){
document.querySelectorAll('.type-tab').forEach(function(t){
t.classList.remove('active');
if(t.dataset.type===result.type)t.classList.add('active');
});
currentType=result.type;
currentCategory='';
renderCategories();
}
if(result.amount){document.getElementById('amount').value=result.amount;}
if(result.date){document.getElementById('date').value=result.date;}
}

function exportData(){
var records=getRecords();
if(records.length===0){showToast('暂无记录可导出');return;}
var data={app:'bookkeeping',version:1,exportDate:new Date().toISOString(),recordCount:records.length,records:records};
var json=JSON.stringify(data,null,2);
var blob=new Blob([json],{type:'application/json'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
var d=new Date();
var fname='记账备份_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json';
a.href=url;
a.download=fname;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);},1000);
showToast('已导出 '+records.length+' 条记录');
}

var pendingImportData=null;

function handleImportFile(input){
var file=input.files[0];
if(!file)return;
var reader=new FileReader();
reader.onload=function(e){
try{
var parsed=JSON.parse(e.target.result);
if(!parsed.records||!Array.isArray(parsed.records)){showToast('文件格式不正确');input.value='';return;}
var validRecords=parsed.records.filter(function(r){
return r&&typeof r.amount==='number'&&r.type&&r.category&&r.date;
});
if(validRecords.length===0){showToast('文件中没有有效记录');input.value='';return;}
pendingImportData=validRecords;
var currentCount=getRecords().length;
var infoText='即将导入 <b>'+validRecords.length+'</b> 条记录';
if(currentCount>0){
infoText+='，将<b>覆盖</b>当前已有的 <b>'+currentCount+'</b> 条记录';
}else{
infoText+='，当前无已有记录';
}
infoText+='<br><br>此操作<b>不可撤销</b>，建议先导出备份';
document.getElementById('modalText').innerHTML=infoText;
document.getElementById('confirmModal').classList.add('show');
}catch(err){
showToast('读取失败：'+err.message);
}
input.value='';
};
reader.readAsText(file);
}

function closeModal(){
document.getElementById('confirmModal').classList.remove('show');
pendingImportData=null;
}

document.getElementById('modalConfirmBtn').onclick=function(){
if(!pendingImportData)return;
saveRecords(pendingImportData);
closeModal();
exitEditMode();
document.getElementById('amount').value='';
document.getElementById('note').value='';
document.getElementById('date').value=getTodayStr();
currentType='expense';
currentCategory='';
document.querySelectorAll('.type-tab').forEach(function(t){t.classList.remove('active');if(t.dataset.type==='expense')t.classList.add('active');});
renderCategories();
var items=document.querySelectorAll('.cat-item');
for(var i=0;i<items.length;i++){items[i].classList.remove('selected');}
resetOcrArea();
updateSummary();
renderRecordList();
renderYearStats();
renderStats();
showToast('已恢复 '+pendingImportData.length+' 条记录');
};

document.getElementById('date').value=getTodayStr();
renderCategories();
updateSummary();
renderRecordList();
renderYearStats();
renderStats();
</script>
</body>
